
name: Generate Hospital Coverage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Generate coverage data
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: python scripts/generate_hospital_coverage.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hospital_coverage.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Update hospital driving-time coverage data"
            git push
          fi
